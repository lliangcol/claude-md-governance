name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install -e ".[test,build]"
      - name: Run tests
        run: |
          python -m pytest -q
          claude-md-governance doctor
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Wheel install smoke
        run: python scripts/wheel_smoke.py --wheel dist/*.whl
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: claude-md-governance-dist
          path: dist/*
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          release_notes="docs/release-notes-${tag}.md"
          if [ -f "$release_notes" ]; then
            notes_args=(--notes-file "$release_notes")
          else
            notes_args=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" "${notes_args[@]}"
          fi
