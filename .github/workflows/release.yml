name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install build
      - name: Run tests
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
          claude-md-governance doctor
      - name: Build package
        run: python -m build
