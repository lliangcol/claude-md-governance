name: AGENTS.md Governance

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".agents/**"
      - ".codex/**"
      - ".claude/**"
      - ".claude-governance/**"
      - "scripts/claude_*"
      - "tests/ai_behavior_cases*.json"
  push:
    branches:
      - main

jobs:
  governance:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Static lint
        run: python scripts/claude_md_lint.py --policy .claude-governance/policy.json --output .claude-governance/score.json
      - name: Governance smoke tests
        run: python scripts/verify_claude_governance.py
